[project]
name = "scrapekit"
version = "0.1.0"
description = "Tiered, target-driven web scraping: httpx first, Crawl4AI when a page forces it, local LLM last."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Michael Miller", email = "michael.joseph.miller@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crawl4ai>=0.9.3",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.6",
]

[project.scripts]
sk = "scrapekit.cli:main"

[project.optional-dependencies]
tier4 = [
    "stagehand>=4",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real websites; run with -m live"]
addopts = "-m 'not live'"
